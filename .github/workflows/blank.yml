name: Pokemon restock monitor

on:
  # Automatic runs are OFF: the monitor now runs on Reydel's Mac (see install-mac.sh),
  # because Target and Walmart block GitHub's servers. To turn GitHub runs back on, add:
  #   schedule:
  #     - cron: "*/5 * * * *"
  workflow_dispatch: {}      # lets you click "Run workflow" by hand

concurrency:
  group: restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Remember what was already texted between runs
      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}
          restore-keys: restock-state-

      - name: Check stores
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python monitor.py --once

      - name: Which stores can be monitored
        if: github.event_name == 'workflow_dispatch'
        run: python monitor.py --check-stores

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}
