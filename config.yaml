# ---------- Where alerts go ----------
# Free ntfy app: install it on your phone and subscribe to this exact name.
ntfy_topic: pokemon_Hernandawgs69

# ---------- Where you are ----------
home:
  name: Gulf Breeze, FL
  zip: "32561"
  lat: 30.3571
  lon: -87.1639
  radius_miles: 50

# ---------- How often (only used in --loop mode on a server) ----------
schedule:
  min_minutes: 5
  max_minutes: 8      # randomized between min and max so it doesn't look like a bot

# ---------- Alert rules ----------
alerts:
  priority_categories: ["Elite Trainer Box", "Booster Bundle"]   # + anything "30th Anniversary"
  msrp_tolerance: 0.05        # within 5% of MSRP counts as "at MSRP"
  only_msrp: false            # true = never text about marked-up listings
  max_texts_per_check: 8      # anything beyond this is bundled into one summary text
  source_failure_warn_after: 12   # text you if a retailer check fails this many times in a row

# Typical US MSRPs – edit if Pokémon changes prices
msrp:
  Elite Trainer Box: 59.99
  Booster Bundle: 29.99
  Booster Pack: 5.49
  Booster Box: 161.64
  Tin: 29.99
  Premium Collection: 79.99
  Collection Box: 39.99

# ---------- Retailers ----------
sources:
  target:
    enabled: true
    keywords: ["pokemon trading cards", "pokemon elite trainer box", "pokemon booster bundle"]
    max_pages: 3

  walmart:
    enabled: true          # EXPERIMENTAL – Walmart often blocks automated checks
    warn_on_failure: false # don't send "failing" alerts when Walmart blocks us
    keyword: "pokemon trading cards"
